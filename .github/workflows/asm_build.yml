name: Build Android Code Studio

on:
  push:
    branches: 
      - "dev"
      - "main" 
      - "indexing"
      - "release/**"
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch: { }

permissions:
  contents: read
  packages: read

jobs:
  build_release_apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    env:
      GPR_USER: ${{ secrets.TREE_SITTER_PACKAGES_USER || github.actor }}
      GPR_TOKEN: ${{ secrets.TREE_SITTER_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Create local.properties
        run: |
          echo "signing.storeFile=signing/signing-key.jks" >> local.properties
          echo "signing.storePassword=123456" >> local.properties  
          echo "signing.keyAlias=android-ide" >> local.properties
          echo "signing.keyPassword=123456" >> local.properties
      - name: Debug signing setup
        run: |
          echo "=== Repository structure ==="
          find . -name "*.jks" -o -name "local.properties" | head -10
          echo ""
          echo "=== local.properties content ==="
          cat local.properties || echo "local.properties not found"
          echo ""
          echo "=== SigningDirectory ==="
          ls -la core/app/signing/ || echo "core/app/signing directory not found"
      - name: Assemble Release APK
        # run: ./gradlew :core:app:assembleDebug
        run: ./gradlew :core:app:assembleRelease
      - name: List APK files (release)
        run: ls -la core/app/build/outputs/apk/release/
      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-release
          path: core/app/build/outputs/apk/release/*arm64-v8a*.apk
        if: always()
      - name: Upload armeabi-v7a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a-release
          path: core/app/build/outputs/apk/release/*armeabi-v7a*.apk
        if: always()
      - name: Upload x86_64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64-release
          path: core/app/build/outputs/apk/release/*x86_64*.apk
        if: always()
      - name: Upload universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal-release
          path: core/app/build/outputs/apk/release/*universal*.apk
        if: always()

      # 使用仓库内 docs/misc/cloud139（x86-64 ELF）将 release APK 上传至 139 云盘。
      # 用法见 docs/misc/cloud139.md：login -t <token> / mkdir <dir> / upload <local> <remoteDir> [-f]
      #
      # 定位：云盘上传是本 workflow 的**附属动作**，用于分发便利；
      # 它成功与否不影响 release APK 是否已构建成功。
      # 因此本步骤整体设置为「尽力上传」：任何失败只产生 warning，绝不使 CI 失败。
      - name: Upload Release APKs to 139 Cloud (cloud139)
        if: always()
        continue-on-error: true
        timeout-minutes: 30
        env:
          # 优先使用仓库 Secrets 中的 CLOUD139_TOKEN；未配置时回退到内置默认 token。
          CLOUD139_TOKEN: "${{ secrets.CLOUD139_TOKEN || 'cGM6MTM5NzA0MzEyMDE6TmhHMVlTYWJ8MXxSQ1N8MTc5MjEyMzczNjcwNHxSek5od3pReFBZd1JpZXQwaGR5Lm5kSXRuNDJwY01HZllHZmJIVmF4bkVTUF8yRWRzbDZIbURHWXUwamJhWWs5OWxtV1NVNk1MUEhkMGJNWlV6NktMSnZreEc3NWwuRVNXTFJWLnFrblo2ejNEczl0T2N6UG1TeVRhc0ZsMjdHOGdIM2dBcks3NVY3UEtjRHVZNHZ4T1g3U0ZRMlFvNXVaYUVvTDltc3cuRVEt' }}"
          # 云盘基础目录；实际产物落在 <基础目录>/build-<run_number>/，避免历史产物互相重名。
          CLOUD139_BASE_DIR: /AndroidCodeStudio
        run: |
          # GitHub Actions 的 run 默认以 `bash -e` 执行（隐式 set -e），
          # 会让任意一条失败命令中断步骤。本步骤为尽力上传，显式关闭 errexit，
          # 每条命令自行判断失败并降级为 warning。
          set +e

          APK_DIR="core/app/build/outputs/apk/release"
          CLOUD139_BIN="$PWD/docs/misc/cloud139"

          if [ ! -f "$CLOUD139_BIN" ]; then
            echo "::warning::cloud139 binary not found at $CLOUD139_BIN; skip cloud upload"
            exit 0
          fi
          chmod +x "$CLOUD139_BIN"

          shopt -s nullglob
          APKS=("$APK_DIR"/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::warning::No release APK found in $APK_DIR (build may have failed); skip cloud upload"
            exit 0
          fi
          echo "Found ${#APKS[@]} APK(s) to upload:"
          printf '  %s\n' "${APKS[@]}"

          REMOTE_DIR="${CLOUD139_BASE_DIR}/build-${GITHUB_RUN_NUMBER}"
          echo "Remote target directory: $REMOTE_DIR"

          echo "=== cloud139 login ==="
          if ! "$CLOUD139_BIN" login -t "$CLOUD139_TOKEN"; then
            echo "::warning::cloud139 login failed (token expired/invalid or network unreachable); skip cloud upload"
            exit 0
          fi

          echo "=== ensure remote directory (逐级创建) ==="
          # 实测：cloud139 mkdir 不递归创建父目录。当 /A 不存在时，mkdir /A/B 会报
          # "File or directory not found: A"，且 upload 也不会自动建目录。
          # 因此这里按层级逐段创建。
          # 不使用 -f：该选项在目录同名时会自动改名（生成 "(1)" 后缀），CI 中不应触发。
          cur=""
          IFS='/' read -r -a DIR_PARTS <<< "$REMOTE_DIR"
          for part in "${DIR_PARTS[@]}"; do
            if [ -n "$part" ]; then
              cur="$cur/$part"
              echo "mkdir level: $cur"
              "$CLOUD139_BIN" mkdir "$cur" || echo "  (may already exist, continue)"
            fi
          done

          echo "=== upload APKs ==="
          FAILED=0
          OK=0
          for apk in "${APKS[@]}"; do
            echo "--- uploading $(basename "$apk") ($(stat -c%s "$apk") bytes) ---"
            if "$CLOUD139_BIN" upload "$apk" "$REMOTE_DIR/" -f; then
              OK=$((OK + 1))
            else
              echo "::warning::upload failed: $(basename "$apk")"
              FAILED=$((FAILED + 1))
            fi
          done
          echo "Upload summary: ${OK} succeeded, ${FAILED} failed (of ${#APKS[@]})"
          if [ "$FAILED" -ne 0 ]; then
            echo "::warning::$FAILED APK upload(s) failed; release APK is still available as a workflow artifact"
          fi

          echo "=== verify remote listing (informational) ==="
          "$CLOUD139_BIN" ls "$REMOTE_DIR" -s 50 || echo "::warning::could not list $REMOTE_DIR"

          echo "Cloud upload step finished (failures are non-fatal by design): $REMOTE_DIR"
          exit 0